<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Педагополія — школа, яку створюєш ти</title><style>
:root{--ink:#244c4a;--muted:#6c8580;--bg:#f3f6ef;--paper:#fffefa;--mint:#e3f0e8;--sage:#76a99a;--gold:#edbf77;--line:#d7e6de;--blue:#dcebf1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(30px,5vw,52px);line-height:1.1;letter-spacing:-.04em}h2{font-size:25px}h3{font-size:18px}.wrap{max-width:1150px;margin:auto;padding:24px 17px 70px}.brand{font-weight:900;letter-spacing:.12em;font-size:14px;color:#377d70}.hero{padding:45px 0 25px}.hero p{color:var(--muted);max-width:640px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:22px;box-shadow:0 12px 32px #2a5d4610}.card{display:flex;flex-direction:column;gap:8px}.card p,.muted,small{color:var(--muted)}.card button{margin-top:auto}.btn{border-radius:12px;background:#377e70;color:white;padding:11px 17px;font-weight:750}.btn.alt{background:var(--mint);color:var(--ink)}.btn.outline{background:white;border:1px solid var(--line);color:var(--ink)}.btn.tiny{padding:7px 11px;font-size:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:14px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{padding:12px;border-radius:10px;border:1px solid #bcd4ca;background:white;color:var(--ink);width:100%}.badge{display:inline-block;border-radius:99px;background:var(--mint);padding:5px 11px;font-size:12px;font-weight:800}.warning{background:#fff0d8;color:#86652d}.danger{background:#f9e5e5;color:#8b4c4c}.success{background:#dcefe0;color:#2c7050}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:19px 0}.nav button{background:white;border:1px solid var(--line);padding:9px 12px;border-radius:10px;color:var(--ink)}.nav button.active{background:#397d70;color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:white;border:1px solid var(--line);padding:14px;border-radius:14px}.bar{height:9px;border-radius:99px;background:#e6ece8;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:#7cb3a4}.school{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#dfeae2;padding:15px;border-radius:18px}.room{min-height:154px;border:3px solid #d2bfa6;border-bottom:9px solid #bc9c78;background:linear-gradient(135deg,#fff8e8,#eaf3eb);border-radius:8px;position:relative;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}.room.locked{filter:saturate(.5);background:linear-gradient(135deg,#e6e8e6,#d3ddd8)}.room .big{font-size:37px}.room .mini{font-size:12px;color:#648076}.avatar{width:43px;height:43px;border-radius:13px;background:#e1ece8;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid white}.avatar svg{width:42px;height:42px}.student{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.options{display:grid;gap:9px;margin:15px 0}.option{width:100%;text-align:left;background:#fff;border:2px solid #d5e4dd;border-radius:12px;padding:13px 15px;color:#263f42;font-weight:600}.option:hover,.option.selected{background:#e2f2e9;border-color:#5d9b87}.option.correct{background:#d8f0de;border-color:#4e9a6c}.option.wrong{background:#fbe3e3;border-color:#d38d8d}.notice{padding:12px 14px;background:#fff2d8;border:1px solid #e9d8ae;border-radius:12px;color:#765c35}.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.list{display:grid;gap:9px}.reform{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}.reform.selected{border-color:#468a77;background:#e5f3ea}.voteBox{background:#eaf3ee;border:1px solid #c7e0d3;border-radius:16px;padding:20px}.timer{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}.log{font-size:13px;color:#60776f;border-bottom:1px solid var(--line);padding:7px 0}.hide{display:none!important}.footer{margin-top:35px;color:var(--muted);font-size:12px}.pill{border:1px solid #b9d8cc;border-radius:99px;padding:6px 10px;background:white;color:#42776a;font-size:12px}.roomCode{font-size:35px;letter-spacing:.18em;font-weight:900;color:#31796e}.noticeArea{position:fixed;right:14px;bottom:14px;z-index:5;background:#284f4d;color:white;padding:12px 16px;border-radius:13px;max-width:320px;box-shadow:0 9px 24px #0003}@media(max-width:750px){.grid,.columns,.stats{grid-template-columns:1fr 1fr}.school{grid-template-columns:1fr 1fr}.room{min-height:125px}.wrap{padding:16px 12px 60px}.card,.panel{padding:16px}}@media(max-width:480px){.grid,.columns,.stats{grid-template-columns:1fr}.school{gap:7px;padding:8px}.room{padding:8px;min-height:112px}.room .big{font-size:26px}.room strong{font-size:13px}.room .mini{font-size:10px}.nav button{font-size:12px;padding:8px}}
.guide-backdrop{position:fixed;inset:0;background:#142c2bb8;display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.guide-dialog{width:min(100%,530px);background:#fffefa;border-radius:23px;padding:26px;box-shadow:0 20px 70px #10292755;color:#244c4a}.guide-dialog h2{margin-top:24px}.guide-dialog p{min-height:110px;line-height:1.7;color:#42615e}.guide-progress{height:7px;background:#e4ede7;border-radius:20px;margin-top:19px;overflow:hidden}.guide-progress span{display:block;height:100%;background:#76a99a;transition:width .2s}.guide-dialog .row:last-child{margin-top:20px}@media(max-width:600px){.guide-dialog{padding:20px}.guide-dialog p{min-height:145px}}

.school-scene{position:relative;padding:24px 15px 30px;background:linear-gradient(#d7eaf0 0 39%,#b9d6c4 39% 100%);border-radius:24px;overflow:hidden}.school-roof{height:53px;max-width:700px;margin:0 auto;background:#b98170;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 4px 0 #845e50)}.school-building{max-width:700px;margin:auto;border:8px solid #b99476;border-bottom:18px solid #b99476;background:#f9f1dc;box-shadow:13px 13px 0 #5e7b6b30}.school-building .school{border-radius:0;background:#eadfc7;gap:5px;padding:6px}.school-building .room{min-height:143px;border:3px solid #bfa589;border-bottom:11px solid #a78669;background:linear-gradient(150deg,#fff8ed,#e1efe8)}.school-building .room .big{font-size:43px}.school-building .room:before{content:'';position:absolute;bottom:12px;right:12px;width:36px;height:28px;background:#a7c8c2;border:3px solid #d3aa80;border-radius:4px;opacity:.8}.urgent{border-left:5px solid #d69d55;background:#fff7e9;padding:14px 16px;border-radius:12px;margin:10px 0}.urgent strong{color:#82552b}.phase{padding:16px;background:#e4f2e9;border:1px solid #b6d6c7;border-radius:16px;margin:15px 0}.spotlight{font-weight:850;color:#2c7568}.person-line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #e4eee8}.review-wrong{border-left:4px solid #d99d82;padding:10px 13px;margin:8px 0;background:#fff3ed;border-radius:8px}.review-ok{border-left:4px solid #87b59b;padding:10px 13px;margin:8px 0;background:#edf7ee;border-radius:8px}.mini-button{background:#f3eee3;color:#48645c;border:1px solid #d5cbb4;padding:7px 11px;border-radius:9px}.welcome{background:#e5f2ec;border:2px solid #a9d0ba;border-radius:20px;padding:21px;margin-bottom:15px}.school-info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:600px){.school-info{grid-template-columns:1fr}.school-building .room{min-height:118px}.school-building .room .big{font-size:30px}}
.news-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:16px}.news-card{background:#fffefa;border:1px solid #d7e6de;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 18px #234c3a0a}.news-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.news-reactions{display:grid;gap:8px;margin-top:12px}.reaction{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px;background:#edf6f0}.reaction.mixed{background:#f4f0e6}.reaction.request{background:#fff1df}.news-mood{font-size:12px;font-weight:800;border-radius:20px;padding:3px 8px;background:#ffffffa8}.news-aside{position:sticky;top:15px;align-self:start}.news-empty{padding:24px;text-align:center;color:#6c8580}@media(max-width:750px){.news-layout{grid-template-columns:1fr}.news-aside{position:static}}</style><style>
/* v11: mobile legibility and budget */
.mobile-budget,.budget-banner{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:13px 16px;margin:12px 0;background:#e0efe7;border:1px solid #afd2c0;border-radius:15px;color:#244c4a}
.mobile-budget strong,.budget-banner strong{font-size:clamp(20px,5vw,27px);font-variant-numeric:tabular-nums;color:#206d59}.mobile-budget span:last-child{margin-left:auto;font-size:13px}.budget-banner{flex-direction:column;align-items:flex-start}.budget-banner small{font-size:12px}
.school-scene,.school-building,.school-building .school,.school-building .room{min-width:0;max-width:100%}
.school-building .room{overflow:hidden;overflow-wrap:anywhere;word-break:normal;gap:8px}
.school-building .room strong,.school-building .room .mini{position:relative;z-index:1;overflow-wrap:anywhere;line-height:1.4}
.school-building .room:before{opacity:.25;pointer-events:none}
@media(max-width:650px){.school-scene{padding:14px 8px 18px}.school-building{border-width:4px;border-bottom-width:9px}.school-building .school{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px}.school-building .room{min-height:175px;padding:10px;justify-content:flex-start}.school-building .room .big{font-size:27px}.school-building .room strong{font-size:14px}.school-building .room .mini{font-size:12px;color:#43665e}.school-building .room:before{width:24px;height:20px;right:4px;bottom:4px}.mobile-budget{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px}.mobile-budget span:last-child{margin-left:0}.notice,.urgent,.panel,.news-card{overflow-wrap:anywhere}.roomCode{font-size:clamp(22px,7vw,35px)}}
@media(max-width:360px){.school-building .school{grid-template-columns:1fr}.school-building .room{min-height:125px}.school-building .room .mini{font-size:13px}}

/* v12: small always-visible mobile balance */
.sticky-coins{display:none}
@media(max-width:650px){
 .sticky-coins{display:flex;align-items:center;gap:5px;position:fixed;top:calc(env(safe-area-inset-top, 0px) + 9px);right:10px;z-index:120;background:#fffefa;color:#24594c;border:1px solid #96c8af;border-radius:999px;box-shadow:0 4px 18px #173e3040;padding:7px 11px;font-size:14px;line-height:1.1;max-width:42vw;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}

</style></head><body><main id="root" class="wrap"></main><script>
let guideStep=0,guideOpen=false,guideRole='player';let D,S=null,T=null,screen='home',tab='school',selection=null,answer=null,feedback=null,caseChoice=null,helpOpen=false,otherOpen=false,seenRequests=0,hintShown=false,announcedRound=0;const root=document.getElementById('root');const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const money=n=>Number(n).toLocaleString('uk-UA');const modeName={director:'Директор',zavuchi:'Завучі на нараді',teachers:'Учительська без перерви'};const modeSize={director:1,zavuchi:4,teachers:6};const avatar=(i)=>{const skin=['#e3b58d','#f2c4a2','#b98b72','#a96d52','#e7c39b','#d5a081','#8e604b','#e9bd9a'][i%8],hair=['#57453e','#9d6b4a','#292a32','#49372c'][i%4],shirt=['#7fa7b7','#ba8eb3','#8fae91','#d2a36c'][i%4];return `<span class="avatar"><svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#dceae6"/><ellipse cx="24" cy="48" rx="20" ry="17" fill="${shirt}"/><ellipse cx="24" cy="22" rx="13" ry="15" fill="${skin}"/><path d="M11 20Q8 3 24 5Q41 4 37 22L33 15Q21 18 13 14Z" fill="${hair}"/><circle cx="19" cy="23" r="1.5" fill="#3c3433"/><circle cx="29" cy="23" r="1.5" fill="#3c3433"/><path d="M20 30Q24 33 28 30" stroke="#835b52" fill="none" stroke-width="1.4" stroke-linecap="round"/></svg></span>`};const toast=s=>{let n=document.createElement('div');n.className='noticeArea';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),3200)};
async function api(action,extra={}){let b={action,...extra};if(S){b.code=S.code;b.token=T}let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(!r.ok)throw Error(j.error||'Помилка');if(j.room)S=j.room;return j}
async function go(action,extra={}){try{await api(action,extra);feedback=null;render()}catch(x){toast(x.message)}}
function saveSession(){localStorage.setItem('pedagopoliya_online_session',JSON.stringify({code:S.code,token:T}))}function leave(){S=null;T=null;localStorage.removeItem('pedagopoliya_online_session');screen='home';render()}
function header(){return `<div class="row between"><div class="brand">✦ ПЕДАГОПОЛІЯ</div><button class="btn tiny outline" data-a="tutorial">❔ Як грати</button>${S?`<div class="row"><span class="badge">${e(S.name)} · ${e(S.code)}</span><button class="btn tiny outline" data-a="leave">Вийти</button></div>`:''}</div>`}
function home(){return `${header()}<div class="hero"><span class="badge">Навчальна стратегія · 9–11 класи</span><h1>Побудуй школу, в якій<br>хочеться навчатися.</h1><p>Досліджуй кімнати, допомагай учням, проходь педагогічні випробування й розвивай власну школу — самостійно або з командою.</p></div><div class="grid"><div class="card"><div style="font-size:36px">🎓</div><h2>Педагогічна комісія</h2><p>Створити кімнату для учнів</p><button class="btn" data-screen="create">Створити кімнату</button></div><div class="card"><div style="font-size:36px">🏫</div><h2>Шкільна адміністрація</h2><p>Увійти в кімнату за кодом</p><button class="btn" data-screen="join">Увійти за кодом</button></div><div class="card"><div style="font-size:36px">🌱</div><h2>Сам собі вчитель</h2><p>Соло-гра без коду, голосування та викладача</p><button class="btn" data-screen="solo">Грати самостійно</button></div></div>`}
function form(){if(screen==='create')return `${header()}<div class="panel" style="max-width:730px;margin:35px auto"><button class="btn outline tiny" data-screen="home">← Назад</button><h2 style="margin-top:15px">Створити кімнату</h2><p class="muted">Вибери кількість учасників. Код з'явиться після створення.</p><div class="grid">${Object.entries(modeName).map(([k,n])=>`<button class="card option ${selection===k?'selected':''}" data-mode="${k}"><b>${e(n)}</b><small>${modeSize[k]} ${modeSize[k]===1?'гравець':'гравців'}</small></button>`).join('')}</div><div class="field"><label>Назва школи</label><input id="schoolName" placeholder="Наприклад, Ліцей майбутнього" maxlength="70"></div><button class="btn" data-a="create" ${!selection?'disabled':''}>Створити онлайн-кімнату</button></div>`;
if(screen==='join')return `${header()}<div class="panel" style="max-width:530px;margin:35px auto"><button class="btn outline tiny" data-screen="home">← Назад</button><h2 style="margin-top:15px">Увійти в кімнату</h2><div class="field"><label>Код від викладача</label><input id="code" placeholder="ABC123" maxlength="6" style="text-transform:uppercase;letter-spacing:3px"></div><div class="field"><label>Твоє ім'я</label><input id="name" maxlength="36" placeholder="Як тебе називати?"></div><button class="btn" data-a="join">Приєднатися</button></div>`;
return `${header()}<div class="panel" style="max-width:530px;margin:35px auto"><button class="btn outline tiny" data-screen="home">← Назад</button><h2 style="margin-top:15px">Сам собі вчитель</h2><p>Ти — директор своєї школи. Без викладача й голосування.</p><div class="field"><label>Назва школи</label><input id="schoolName" placeholder="Моя школа"></div><div class="field"><label>Твоє ім'я</label><input id="name" placeholder="Директор"></div><button class="btn" data-a="solo">Розпочати гру</button></div>`}
function lobby(){return `${header()}<div class="panel" style="margin-top:30px"><span class="badge">${e(modeName[S.mode])} · ${S.capacity} учасників</span><h1 style="margin-top:16px">${e(S.name)}</h1><p class="muted">Код для входу учнів</p><div class="roomCode">${e(S.code)}</div><button class="btn alt tiny" data-a="copy">Скопіювати код</button><h3 style="margin-top:25px">У кімнаті: ${S.players.length}/${S.capacity}</h3><div class="grid">${S.players.map((p,i)=>`<div class="student">${avatar(i)}<b>${e(p.name)}</b></div>`).join('')||'<p class="muted">Очікуємо учасників…</p>'}</div>${S.host?`<button class="btn" style="margin-top:18px" data-a="start" ${S.players.length!==S.capacity?'disabled':''}>Почати гру</button>`:'<div class="notice" style="margin-top:20px">Очікуємо, поки викладач розпочне гру. Сторінка оновлюється автоматично.</div>'}</div>`}
function stats(){return `<div class="stats">${D.names.map((n,i)=>`<div class="metric"><small>${e(n)}</small><div class="row between"><b>${S.scores[i]}/100</b></div><div class="bar"><span style="width:${S.scores[i]}%"></span></div></div>`).join('')}</div>`}
function nav(){let tabs=S.host?['dashboard','school','students','reforms','news','journal']:['school','students',S.round%2?'quiz':'cases',...(S.incident?['incident']:[]),'reforms',...(S.capacity>1?['vote']:[]),'news','journal'];let labels={incident:'🚨 Ситуація',dashboard:'📊 Статистика',school:'🏫 Школа',students:'👥 Учні',quiz:'🧠 Тест',cases:'💬 Ситуації',reforms:'🛠 Реформи',vote:'🗳 Голосування',news:'📰 Новини школи',journal:'📒 Журнал'};if(!tabs.includes(tab))tab=tabs[0];return `<div class="nav">${tabs.map(k=>`<button class="${tab===k?'active':''}" data-tab="${k}">${labels[k]}</button>`).join('')}</div>`}
function school(){const incident=S.incident;const newcomer=S.announcements?.find(x=>x.round===S.round);const needs=[['🏃','Спортивні активності','Аліна хоче займатися спортом, Олег — грати у футбол, Василь — більше рухатися на перервах.','gym'],['🗣️','Учнівський голос','Софійка хоче долучитися до самоврядування й бути почутою.','council'],['🤝','Безпека та підтримка','Учням потрібне місце для довірливих розмов і вирішення конфліктів.','psych']];return `<div class="columns"><div class="panel"><h2>🏫 Наша школа — натискай на кімнати</h2><p class="muted">Це <b>будівля школи в розрізі</b>. Кожна кімната відкриває інформацію та можливості для розвитку.</p><div class="school-scene"><div class="school-roof"></div><div class="school-building"><div class="school">${D.rooms.map(r=>{let locked=(r.id==='music'||r.id==='gym')&&!S.gates[r.id];return `<button class="room ${locked?'locked':''}" data-room="${r.id}"><strong>${locked?'🔒 ':''}${e(r.name)}</strong><span class="big">${locked?'🚧':r.emoji}</span><span class="mini">${locked?'Потрібне випробування':e(r.desc.slice(0,44))}</span></button>`}).join('')}</div></div></div><p class="muted" style="margin-top:12px">💡 <b>Порада:</b> натисни на спортзал, учнівську раду або психологічну кімнату, щоб дізнатися більше.</p></div><div class="stack"><div class="panel"><h3>📍 Що зараз робити?</h3>${phasePanel()}</div><div class="panel"><h3>🚨 Нагальні потреби учнів</h3>${needs.map(x=>`<div class="urgent"><strong>${x[0]} ${x[1]}</strong><p>${x[2]}</p><button class="btn tiny alt" data-room="${x[3]}">Переглянути кімнату →</button></div>`).join('')}</div>${newcomer?`<div class="welcome"><span class="badge success">Новий учень!</span><h3 style="margin-top:9px">Знайомтеся: ${e(newcomer.name)}, ${newcomer.age} років</h3><p>${e(newcomer.reason)}</p><b>${e(newcomer.need)}</b></div>`:''}<div class="panel"><h3>❤️ Атмосфера школи</h3><p><b>Навчання:</b> ${S.scores[0]}/100 · <b>Комфорт:</b> ${S.scores[1]}/100</p><p><b>Мотивація:</b> ${S.scores[2]}/100 · <b>Доступність:</b> ${S.scores[3]}/100</p><small>Це умовні ігрові показники, а не діагностика конкретних дітей.</small></div></div></div>`}
function phasePanel(){if(!S.challengeSettled)return `<div class="phase"><b>Крок 1. Заробіть монети</b><p>Бюджет: <strong>${money(S.budget)} 🪙</strong>. ${S.round%2?'Пройдіть тест із 5 запитань.':'Розв’яжіть 3 педагогічні задачі.'}</p><button class="btn" data-tab="${S.round%2?'quiz':'cases'}">Перейти до завдання →</button></div>`;if(S.incident&&!S.incidentDone)return `<div class="phase"><b>Крок 2. Термінова ситуація</b><p>${e(S.incident.title)}</p><button class="btn" data-tab="incident">Розв’язати ситуацію →</button></div>`;if(S.roundBought===0)return `<div class="phase"><b>Крок 2. Оберіть реформу</b><p>Зароблено <strong>${money(S.budget)} 🪙</strong>. Раунд <b>не завершиться</b>, поки не оберете хоча б одну доступну реформу.</p><button class="btn" data-tab="reforms">Перейти до реформ →</button></div>`;return `<div class="phase"><b>Крок 3. Школа розвивається!</b><p>У цьому раунді впроваджено <b>${S.roundBought}/2</b> реформ. ${S.roundBought<2?'Можна обрати ще одну або перейти далі.':'Ліміт реформ використано.'}</p>${S.roundBought<2?'<button class="btn alt" data-tab="reforms">Ще одна реформа</button> ':''}${S.capacity===1&&S.round<6?'<button class="btn" data-a="next">Завершити раунд →</button>':''}</div>`}

function roomDetail(id){const r=D.rooms.find(x=>x.id===id);if(!r)return school();let locked=(id==='music'||id==='gym')&&!S.gates[id];return `<div class="panel"><button class="btn tiny outline" data-room="">← До школи</button><h2 style="margin-top:18px">${e(r.name)}</h2><p>${e(r.desc)}</p>${locked?`<div class="notice">🔒 Приміщення поки недоступне. Щоб відкрити його, завершіть педагогічне випробування поточного раунду.</div><button class="btn" style="margin-top:12px" data-a="gate" data-id="${id}" ${!S.challengeSettled||S.host?'disabled':''}>Відкрити приміщення</button>`:`<h3>Учні в цьому просторі</h3><div class="grid">${D.students.filter(x=>x.room===id).map(x=>{let i=D.students.indexOf(x);return `<div class="student">${avatar(i)}<div><b>${e(x.name)}</b><br><small>${e(x.grade)}</small></div></div>`}).join('')||'<p>Наразі тут немає основних персонажів.</p>'}</div>`}</div>`}
function students(){const newcomers=S.announcements||[];return `<h2>👩‍🎓 Наші учні та їхні історії</h2><p class="muted">Звертай увагу на <b>потреби</b> й <b>стосунки</b> між учнями — вони підказують, які реформи справді потрібні.</p>${newcomers.map(x=>`<div class="welcome"><span class="badge success">Новий учень · раунд ${x.round}</span><h3>🎉 ${e(x.name)}, ${x.age} років · ${e(x.grade)}</h3><p>${e(x.reason)}</p><b>Потреба: ${e(x.need)}</b></div>`).join('')}<div class="grid">${D.students.map((s,i)=>`<div class="card"><div class="row">${avatar(i)}<div><b>${e(s.name)}</b><br><small>${e(s.grade)} · ${s.age} років</small></div></div><p>${e(s.story)}</p><div class="notice"><b>Що потрібно:</b> ${e(s.needs)}</div></div>`).join('')}</div>`}

function review(items){return items.map((x,i)=>`<div class="${x.ok?'review-ok':'review-wrong'}"><b>${x.ok?'✓':'✕'} ${i+1}. ${e(x.question)}</b><p><small>Відповідь: ${e(x.options[x.selected]||'—')}</small></p>${!x.ok?`<p><b>Правильна:</b> ${e(x.options[x.correct]||'—')}</p>`:''}</div>`).join('')}
function completed(kind){const quiz=kind==='quiz',score=quiz?S.quizResult:S.caseResult,total=quiz?5:3,items=quiz?S.quizReview:S.caseReview;return `<div class="panel"><span class="badge ${score===0?'warning':'success'}">${score===0?'Спробуй ще раз':'✓ Завдання виконано'}</span><h2 style="margin-top:12px">Результат: ${score} із ${total}</h2><p><b>${S.challengeSettled?'Монети вже нараховані школі.':'Чекаємо результатів інших учасників.'}</b> Бюджет: ${money(S.budget)} 🪙</p>${S.capacity===1&&!S.host&&S.challengeSettled&&S.roundBought===0&&(score===0||!D.reforms.some(x=>!S.owned.includes(x.id)&&(x.level===1||S.owned.includes(x.id-1))&&x.cost<=S.budget))?`<div class="notice" style="margin:14px 0"><b>${score===0?'Жодної правильної відповіді.':'Поки недостатньо монет для реформи.'}</b><p>Це не кінець гри! Переглянь пояснення нижче й <b>пройди випробування ще раз</b>. ${!S.solo?'За потреби виклич педагогічну комісію, щоб викладач допоміг розібрати помилки.':'У самостійній грі можеш скористатися підказками до запитань.'}</p></div><button class="btn" data-a="retry">↻ Спробувати ще раз</button>${!S.solo?'<button class="btn alt" data-a="helpopen">🔔 Викликати педагогічну комісію</button>':''}`:`<div class="row"><button class="btn" data-tab="${S.incident&&!S.incidentDone?'incident':'reforms'}">${S.incident&&!S.incidentDone?'Розв’язати нагальну ситуацію':'Перейти до вибору реформи'} →</button></div>`}<h3 style="margin-top:22px">Розбір відповідей</h3>${review(items||[])}</div>`}
function quiz(){if(!S.quizOn)return `<div class="notice">Викладач тимчасово закрив тести.</div>`;if(S.quizDone)return completed('quiz');let idx=S.quizCount,q=D.qs[((S.round-1)/2*10+idx*2+S.players.findIndex(p=>p.id===S.me))%30];return `<div class="panel"><span class="badge">Запитання ${idx+1}/5</span><h2 style="margin-top:16px">${e(q[0])}</h2><p class="muted">Обери <b>найточнішу відповідь</b>, а потім натисни «Підтвердити».</p><div class="options">${q[1].map((a,i)=>`<button class="option ${answer===i?'selected':''}" data-answer="${i}">${'АБВГ'[i]}. ${e(a)}</button>`).join('')}</div>${S.capacity===1&&!S.host?`<button class="mini-button" data-a="hint">💡 ${hintShown?'Сховати підказку':'Показати підказку'}</button>${hintShown?`<div class="notice" style="margin:10px 0"><b>Підказка:</b> подумай, яке рішення найбільше підтримує <b>потреби учня</b>, його <b>гідність</b> та <b>безпечне навчання</b>. Уважно порівняй формулювання.</div>`:''}`:''}<div style="margin-top:14px"><button class="btn" data-a="submitquiz" ${answer===null?'disabled':''}>Підтвердити відповідь</button></div></div>`}
function cases(){if(!S.casesOn)return `<div class="notice">Викладач тимчасово закрив педагогічні ситуації.</div>`;if(S.caseDone)return completed('case');let idx=S.caseCount,ci=((S.round/2-1)*3+idx)%D.cases.length,c=D.cases[ci];return `<div class="panel"><span class="badge">Педагогічна задача ${idx+1}/3</span><h2 style="margin-top:15px">${e(c[0])}</h2><div class="urgent"><b>Що сталося?</b><p>${e(c[1])}</p></div><p><b>Твоє завдання:</b> обери найбільш педагогічно обґрунтоване рішення.</p><div class="options">${D.caseOptions[ci].map((x,i)=>`<button class="option ${caseChoice===i?'selected':''}" data-case="${i}">${'АБВГ'[i]}. ${e(x)}</button>`).join('')}</div>${S.capacity===1&&!S.host?`<button class="mini-button" data-a="hint">💡 Підказка</button>${hintShown?'<div class="notice">Шукай рішення, яке враховує <b>безпеку</b>, <b>права</b> та <b>підтримку</b> учнів.</div>':''}`:''}<button class="btn" data-a="submitcase" ${caseChoice===null?'disabled':''}>Підтвердити рішення</button></div>`}
function incident(){if(!S.incident)return `<div class="panel"><h2>Нагальні ситуації</h2><p>Поки що нових повідомлень немає.</p></div>`;let x=S.incident;return `<div class="panel"><span class="badge warning">🚨 Нагальна ситуація</span><h2 style="margin-top:13px">${e(x.title)}</h2><div class="urgent"><p>${e(x.desc)}</p></div>${S.incidentDone?`<div class="phase"><b>✓ Рішення прийнято</b><p>${e(x.explanation)}</p><p>${S.incidentChoice===0?'Правильне рішення: +180 🪙':'Переглянь обґрунтування та спробуй застосувати його в наступних ситуаціях.'}</p><button class="btn" data-tab="reforms">Перейти до реформ →</button></div>`:`<p><b>Як діяти адміністрації?</b> Обери рішення:</p><div class="options">${x.options.map((o,i)=>`<button class="option ${caseChoice===i?'selected':''}" data-case="${i}">${'АБВ'[i]}. ${e(o)}</button>`).join('')}</div><button class="btn" data-a="incident" ${caseChoice===null?'disabled':''}>Ухвалити рішення</button>`}</div>`}

function reforms(){return `<h2>Реформи школи</h2><div class="budget-banner"><span>Шкільний бюджет</span><strong>${money(S.budget)} 🪙</strong><small>Монети заробляються за педагогічні випробування</small></div>${S.challengeSettled&&S.roundBought===0&&!D.reforms.some(x=>!S.owned.includes(x.id)&&(x.level===1||S.owned.includes(x.id-1))&&x.cost<=S.budget)?`<div class="notice"><b>На реформу поки не вистачає монет.</b> Повернись до результату випробування та спробуй ще раз.</div>`:''}<p class="muted">Можна впровадити до двох реформ за раунд. Кожна наступна потребує попереднього рівня.</p><div class="grid">${D.reforms.map(x=>{let owned=S.owned.includes(x.id),unlocked=x.level===1||S.owned.includes(x.id-1);return `<div class="card"><div class="row between"><span class="badge">${e(x.cat)} · рівень ${x.level}</span><b>${money(x.cost)} 🪙</b></div><h3>${e(x.title)}</h3><small>${x.effect.map((n,i)=>n?`+${n} ${D.names[i].toLowerCase()}`:'').filter(Boolean).join(' · ')}</small><span class="badge ${owned?'success':!unlocked?'warning':''}">${owned?'✓ Впроваджено':unlocked?'Доступно':'🔒 Попередній рівень'}</span>${S.capacity===1&&!S.host?`<button class="btn" data-a="reform" data-id="${x.id}" ${owned||!unlocked||!S.challengeSettled||S.budget<x.cost||S.roundBought>=2?'disabled':''}>Впровадити реформу</button>`:''}</div>`}).join('')}</div>`}
function vote(){const v=S.vote,elig=D.reforms.filter(x=>!S.owned.includes(x.id)&&(x.level===1||S.owned.includes(x.id-1))&&x.cost<=S.budget&&S.roundBought<2);return `<div class="panel"><h2>Таємне голосування</h2>${!S.challengeSettled?'<div class="notice">Спочатку всі учасники мають завершити випробування.</div>':''}${v.phase==='collect'?`<p>Голосів подано: ${v.submittedCount}/${S.capacity}. ${v.submitted?'Твій голос враховано.':'Обери реформу.'}</p><div class="options">${elig.map(x=>`<button class="option" data-a="vote" data-id="${x.id}" ${!S.challengeSettled?'disabled':''}>${e(x.title)} · ${money(x.cost)} 🪙</button>`).join('')}</div>`:v.phase==='discuss'?`<div class="voteBox"><span class="badge warning">Голоси розділилися</span><h3 style="margin-top:12px">Час для обговорення</h3><div class="timer" id="clock">${clock(v.endsAt)}</div><p>Можна тричі додати по 30 секунд. Під час обговорення кожен може змінити голос.</p><button class="btn alt" data-a="extend" ${v.extensions>=3?'disabled':''}>+30 секунд (${v.extensions}/3)</button><div class="options">${v.pair.map(id=>`<button class="option" data-a="vote" data-id="${id}">Змінити голос: ${e(D.reforms[id].title)} · ${v.counts[id]||0} голосів</button>`).join('')}</div><button class="pill" data-a="others">Переглянути інші варіанти</button>${otherOpen?`<div class="notice" style="margin-top:10px">${elig.filter(x=>!v.pair.includes(x.id)).map(x=>e(x.title)).join(' · ')||'Інших доступних реформ немає'}. Для зміни списку потрібне нове голосування, яке може запустити викладач.</div>`:''}<p style="margin-top:12px"><button class="btn" data-a="retally" ${Date.now()<v.endsAt?'disabled':''}>Повторно підрахувати голоси</button></p></div>`:v.phase==='approved'?`<div class="notice">✓ Більшість підтримала реформу: <b>${e(D.reforms[v.choice]?.title)}</b>. Очікуємо підтвердження викладача.</div>`:'<div class="notice">Рішення поки не ухвалено.</div>'}</div>`}
function clock(end){let t=Math.max(0,Math.ceil((end-Date.now())/1000));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function dashboard(){return `<div class="stack"><div class="panel"><div class="row between"><h2>Центр педагогічної комісії</h2><span class="badge success">Онлайн</span></div><div class="row"><span class="badge">Учасники ${S.players.length}/${S.capacity}</span><span class="badge">Раунд ${S.round}/6</span><span class="badge">Бюджет ${money(S.budget)} 🪙</span></div><h3 style="margin-top:17px">Склад команди</h3><div class="grid">${S.players.map((p,i)=>`<div class="student">${avatar(i)}<div><b>${e(p.name)}</b><br><small>${S.round%2?(p.quizDone?`Тест: ${p.quizResult}/5 правильно`:`Тест ${p.quizCount}/5`):(p.caseDone?`Кейси: ${p.caseResult}/3 правильно`:`Кейси ${p.caseCount}/3`)}</small>${(S.round%2?p.quizAnswers:p.caseAnswers)?.length?`<details><summary>Переглянути відповіді</summary>${review(S.round%2?p.quizAnswers:p.caseAnswers)}</details>`:''}</div></div>`).join('')}</div><div class="row" style="margin-top:17px"><button class="btn" data-a="next" ${!S.challengeSettled||S.round===6||S.roundBought===0||(S.incident&&!S.incidentDone)?'disabled':''}>Наступний раунд →</button>${S.vote.phase==='approved'?`<button class="btn" data-a="reform" data-id="${S.vote.choice}">Затвердити реформу: ${e(D.reforms[S.vote.choice].title)}</button>`:''}${S.vote.phase==='discuss'?'<button class="btn alt" data-a="restartvote">Почати нове голосування</button>':''}</div></div><div class="panel"><h3>Керування завданнями</h3><label><input type="checkbox" id="quizOn" ${S.quizOn?'checked':''}> Дозволити тести</label><br><label><input type="checkbox" id="casesOn" ${S.casesOn?'checked':''}> Дозволити педагогічні ситуації</label><br><button class="btn tiny" style="margin-top:12px" data-a="settings">Зберегти</button></div><div class="panel"><h3>Запити на допомогу ${S.requests.filter(x=>x.status==='Очікує').length?'🔔':''}</h3>${S.requests.length?S.requests.slice().reverse().map(x=>`<div class="reform"><b>${e(x.player)}</b> · <small>${new Date(x.at).toLocaleTimeString('uk-UA')}</small><p>${e(x.reason)}</p><span class="badge ${x.status==='Очікує'?'warning':'success'}">${e(x.status)}</span> ${x.status==='Очікує'?`<button class="btn tiny" data-a="resolve" data-id="${x.id}">Опрацьовано</button>`:''}</div>`).join(''):'<p class="muted">Звернень поки немає.</p>'}</div></div>`}
function news(){const items=(S.news||[]).slice().reverse();const types={welcome:'🏫 Початок історії',reform:'🌱 Після реформи',incident:'🚨 Рішення адміністрації',newcomer:'🎉 Новий учень',round:'🔔 Новий раунд'};const labels={happy:'😊 Радіє',mixed:'💭 Розмірковує',request:'📣 Має прохання'};return `<div class="news-layout"><section><div class="row between"><div><h2>📰 Шкільні новини</h2><p class="muted">Що <b>відбувається у школі</b> і як <b>реагують учні</b> на ваші рішення.</p></div><span class="badge">${items.length} повідомлень</span></div>${items.length?items.map(item=>`<article class="news-card"><div class="news-head"><span class="badge ${item.type==='incident'?'warning':item.type==='newcomer'?'success':''}">${types[item.type]||'📰 Новина'}</span><small>Раунд ${item.round}</small></div><h3 style="margin:12px 0 8px">${e(item.title)}</h3><p>${e(item.description)}</p>${item.reactions?.length?`<div class="news-reactions">${item.reactions.map((r,i)=>`<div class="reaction ${e(r.mood)}">${avatar((item.round+i)%8)}<div><div class="row"><b>${e(r.name)}</b><span class="news-mood">${labels[r.mood]||'💬 Коментар'}</span></div><div>${e(r.text)}</div></div></div>`).join('')}</div>`:''}</article>`).join(''):'<div class="news-empty panel">Новин ще немає. Пройдіть випробування та впровадьте першу реформу!</div>'}</section><aside class="panel news-aside"><h3>📍 Що важливо зараз?</h3>${phasePanel()}<p class="muted"><b>Пам’ятайте:</b> радість чи незадоволення персонажів — це частина навчального сценарію. Звертайте увагу на їхні <b>потреби</b>, а не лише на монети.</p><button class="btn alt tiny" data-tab="students">Переглянути учнів →</button></aside></div>`}
function journal(){return `<div class="panel"><h2>Журнал школи</h2>${S.log.slice().reverse().map(x=>`<div class="log">${e(x)}</div>`).join('')}</div>`}
function game(){return `${header()}<div class="sticky-coins" role="status" aria-label="Поточний бюджет школи" title="Поточний бюджет школи">🪙 <strong>${money(S.budget)}</strong></div><div class="row between" style="margin-top:22px"><div><h2>${e(S.name)}</h2><p class="muted">${S.host?'Педагогічна комісія':'Шкільна адміністрація'} · ${e(modeName[S.mode])} · раунд ${S.round}/6</p></div><span class="badge">Код ${e(S.code)}</span></div>${S.announcements?.some(x=>x.round===S.round)?`<div class="welcome"><span class="badge success">🎉 Гарна новина!</span><h3>У школі новий учень: ${e(S.announcements.find(x=>x.round===S.round).name)}</h3><p>${e(S.announcements.find(x=>x.round===S.round).reason)}</p><button class="btn tiny alt" data-tab="students">Познайомитися →</button></div>`:''}${stats()}<div class="mobile-budget"><span>🪙 Бюджет школи</span><strong>${money(S.budget)} монет</strong><span>Раунд ${S.round}/6 · ${S.roundBought}/2 реформ</span></div>${(S.news||[]).length?`<div class="row between" style="margin:12px 0 0"><span class="badge">📰 Остання новина: ${e(S.news[S.news.length-1].title)}</span><button class="btn alt tiny" data-tab="news">Читати реакції учнів →</button></div>`:''}${nav()}${tab==='dashboard'?dashboard():tab==='school'?(selection?roomDetail(selection):school()):tab==='students'?students():tab==='quiz'?quiz():tab==='cases'?cases():tab==='incident'?incident():tab==='reforms'?reforms():tab==='vote'?vote():tab==='news'?news():journal()}${!S.host&&!S.solo?`<div style="margin-top:17px"><button class="btn alt" data-a="helpopen">🔔 Викликати педагогічну комісію</button>${helpOpen?`<div class="panel" style="margin-top:10px"><h3>Чому потрібна допомога?</h3><select id="reason" class="field" style="padding:10px"><option>Потрібна допомога з педагогічним кейсом</option><option>Не можемо домовитися</option><option>Уточнення правил</option><option>Технічна проблема</option></select><button class="btn" data-a="help">Надіслати викладачеві</button></div>`:''}</div>`:''}<p class="footer">Педагополія · навчальна симуляція. Оцінки й емоційні показники персонажів є умовними, а не психологічною діагностикою.</p>`}
const guide={
 player:[
 ['Ласкаво просимо до Педагополії!','Ти керуєш школою. Мета — зробити її безпечнішою, цікавішою й доступнішою. На вкладці «Школа» видно кабінети, потреби дітей і наступний крок.'],
 ['Три види випробувань','У грі є три різні речі: «Тест» — короткі запитання з педагогіки; «Задача» — складніший навчальний кейс; «Ситуація» — термінова подія зі шкільного життя. Не плутай їх: вони з’являються в різні моменти гри.'],
 ['1. Тест — перевір свої знання','У непарних раундах натисни вкладку «Тест». Прочитай запитання, вибери одну відповідь і підтвердь. Після 5 запитань побачиш результат, пояснення помилок і зароблені монети. У соло доступна підказка.'],
 ['2. Задача — подумай як педагог','У парних раундах замість тесту відкривається вкладка «Задача». Там є опис складної педагогічної проблеми та кілька рішень. Обери найбільш обґрунтоване. Це не відкрите есе — писати текст не потрібно.'],
 ['3. Ситуація — реагуй на події','«Ситуація» — це нагальна подія у школі: конфлікт, можливий булінг, труднощі нового учня або прохання дітей. Якщо з’явилася плашка «🚨 Ситуація», відкрий її, прочитай історію та обери, як має діяти адміністрація. Без цього іноді не вийде перейти до реформ.'],
 ['Бюджет завжди перед очима','Кожна нова школа починає з 0 монет. Заробляй їх за правильні відповіді. На телефоні у правому верхньому куті є маленький лічильник 🪙 — це твій поточний бюджет. Він змінюється після нагород і покупок.'],
 ['Що робити, якщо не вийшло?','Якщо результат 0/5 або монет недостатньо для першої реформи, натисни «Спробувати ще раз» на екрані результатів. У грі з викладачем можна викликати педагогічну комісію; у «Сам собі вчитель» користуйся підказками.'],
 ['Кабінети й учні','У «Школі» натискай на кабінети, щоб побачити їхній стан і потреби. У вкладці «Учні» читай історії персонажів. Деякі приміщення треба відкрити, виконавши випробування.'],
 ['Реформи — витрачай із користю','Після тесту чи задачі, а також розв’язання нагальної ситуації, відкрий «Реформи». Перевір ціну та вплив. Можна впровадити до 2 реформ за раунд. Раунд не завершиться без принаймні однієї реформи.'],
 ['Голосування, новини та допомога','У командних кімнатах обирайте реформи голосуванням. За нічиєї обговоріть варіанти й переголосуйте. У «Новинах» читай реакції учнів, у «Журналі» — історію подій. Якщо є викладач, доступна кнопка «Викликати педагогічну комісію». У самостійній грі її немає.']
 ],
 host:[
 ['Ти — педагогічна комісія','Створи кімнату для одного, чотирьох або шести учасників. Ти супроводжуєш гру, але не виконуєш завдання замість учнів.'],
 ['Створи кімнату й передай код','Обери «Директор», «Завучі на нараді» або «Учительська без перерви». Після створення скопіюй код і надішли учасникам. Вони входять через «Шкільна адміністрація».'],
 ['Поясни три види завдань','«Тест» — 5 коротких запитань у непарних раундах; «Задача» — 3 складні педагогічні кейси в парних; «Ситуація» — окрема термінова подія, яка потребує рішення перед реформою.'],
 ['Стеж за прогресом','У панелі педагогічної комісії бачиш бюджет, раунд, кількість учасників, правильні й неправильні відповіді. На телефоні бюджет також видно у верхньому куті.'],
 ['Керуй доступом до завдань','У блоці керування можеш дозволяти або тимчасово закривати тести та задачі. Нагальні ситуації — частина сюжету, їх потрібно опрацювати, коли вони виникають.'],
 ['Допомагай, коли просять','У «Запитах на допомогу» з’являються звернення учнів. Поясни складний момент і познач запит опрацьованим. Якщо тест пройдено на 0/5, учень може спробувати ще раз.'],
 ['Підтримуй голосування','У командах учасники обирають реформи. Якщо голоси розділилися, є час на обговорення та зміну голосу. Після голосування затверди обрану реформу.'],
 ['Коли переходити до наступного раунду?','Переконайся, що завдання завершено, нагальну ситуацію вирішено, а хоча б одну реформу впроваджено. Тоді переходь до наступного раунду.']
 ]};
function openGuide(){guideRole=S?.host||screen==='create'?'host':'player';guideStep=0;guideOpen=true;renderGuide()}
function renderGuide(){let node=document.getElementById('guideOverlay');if(!guideOpen){if(node)node.remove();return}if(!node){node=document.createElement('div');node.id='guideOverlay';document.body.appendChild(node)}let steps=guide[guideRole],item=steps[guideStep];node.innerHTML=`<div class="guide-backdrop"><section class="guide-dialog" role="dialog" aria-modal="true" aria-label="Інструкція до гри"><div class="row between"><span class="badge">Туторіал · ${guideStep+1}/${steps.length}</span><button class="btn tiny outline" data-guide="close" aria-label="Закрити">✕</button></div><div class="guide-progress"><span style="width:${(guideStep+1)/steps.length*100}%"></span></div><h2>${e(item[0])}</h2><p>${e(item[1])}</p><div class="row between"><button class="btn outline" data-guide="prev" ${guideStep===0?'disabled':''}>← Назад</button><button class="btn" data-guide="next">${guideStep===steps.length-1?'Зрозуміло ✓':'Далі →'}</button></div></section></div>`}
function render(){root.innerHTML=!S?(screen==='home'?home():form()):!S.started?lobby():game();renderGuide()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-guide]');if(!b)return;let a=b.dataset.guide;if(a==='close'||a==='next'&&guideStep===guide[guideRole].length-1){guideOpen=false;localStorage.setItem('pedagopoliya_tutorial_'+guideRole,'1')}else if(a==='next')guideStep++;else if(a==='prev')guideStep=Math.max(0,guideStep-1);renderGuide()});

document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-screen],[data-mode],[data-tab],[data-room],[data-answer],[data-case],[data-a]');if(!b)return;if(b.dataset.screen){screen=b.dataset.screen;selection=null;render();return}if(b.dataset.mode){selection=b.dataset.mode;render();return}if(b.dataset.tab){tab=b.dataset.tab;selection=null;hintShown=false;render();return}if(b.dataset.room!==undefined){selection=b.dataset.room;render();return}if(b.dataset.answer!==undefined){answer=+b.dataset.answer;render();return}if(b.dataset.case!==undefined){caseChoice=+b.dataset.case;render();return}let a=b.dataset.a,id=b.dataset.id;if(a==='tutorial'){openGuide();return}if(a==='leave'){leave();return}if(a==='copy'){navigator.clipboard?.writeText(S.code).then(()=>toast('Код скопійовано')).catch(()=>toast(S.code));return}if(a==='create'||a==='solo'){try{let r=await api('create',{mode:a==='solo'?'director':selection,solo:a==='solo',playerName:document.getElementById('name')?.value||'Директор',name:document.getElementById('schoolName').value||'Школа майбутнього'});T=r.token;S=r.room;saveSession();render();if(!localStorage.getItem('pedagopoliya_tutorial_'+(S.host?'host':'player')))openGuide()}catch(x){toast(x.message)}return}if(a==='join'){try{let j=await api('join',{code:document.getElementById('code').value.trim(),name:document.getElementById('name').value.trim()});T=j.token;S=j.room;saveSession();render();if(!localStorage.getItem('pedagopoliya_tutorial_player'))openGuide()}catch(x){toast(x.message)}return}if(a==='helpopen'){helpOpen=!helpOpen;render();return}if(a==='retry'){await go('retry');tab=S.round%2?'quiz':'cases';return}if(a==='others'){otherOpen=!otherOpen;render();return}if(a==='hint'){hintShown=!hintShown;render();return}if(a==='incident'){await go('incident',{answer:caseChoice});caseChoice=null;return}if(a==='submitquiz'){await go('quiz',{index:S.quizCount,answer});answer=null;hintShown=false;return}if(a==='submitcase'){await go('case',{index:S.caseCount,answer:caseChoice});caseChoice=null;hintShown=false;return}if(a==='settings'){await go('settings',{quizOn:document.getElementById('quizOn').checked,casesOn:document.getElementById('casesOn').checked});return}if(a==='help'){await go('help',{reason:document.getElementById('reason').value});helpOpen=false;return}if(['reform','gate','vote','resolve'].includes(a)){await go(a,{id:a==='vote'||a==='reform'?Number(id):id});return}await go(a)});
async function poll(){if(!S)return;try{let old=JSON.stringify(S);let j=await api('state');S=j.room;if(old!==JSON.stringify(S))render()}catch(err){if(/доступ|знайдено/.test(err.message)){leave();toast(err.message)}}}
(async()=>{D=await fetch('/data.json').then(r=>r.json());let ss=JSON.parse(localStorage.getItem('pedagopoliya_online_session')||'null');if(ss){T=ss.token;S={code:ss.code};try{await poll()}catch{leave()}}render();setInterval(poll,2300);setInterval(()=>{let c=document.getElementById('clock');if(c&&S)c.textContent=clock(S.vote.endsAt)},1000)})();
</script></body></html>
